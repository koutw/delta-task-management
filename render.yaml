services:
  # 後端 Web Service (Spring Boot 3 Docker)
  - type: web
    name: delta-task-backend
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend

  # 前端 Static Site (Vue 3 + Vite)
  - type: web
    name: delta-task-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: delta-task-backend
          property: host
